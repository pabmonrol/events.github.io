name: Daily Event Scraper Update

on:
  schedule:
    # ⏱️ Runs EVERY DAY at 05:00 AM UTC (Equivalent to 06:00 AM or 07:00 AM in Switzerland/Spain depending on daylight saving time)
    - cron: '0 3 * * *'
  workflow_dispatch: # ✨ This button allows you to manually trigger the scraper from the GitHub website whenever you want

permissions:
  contents: write # 🔑 Crucial permission so the GitHub runner can save and commit data.json back to your repository

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone the repository's code onto the virtual machine
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python on the virtual machine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Fast and stable version
        cache: 'pip' # Enables caching for faster subsequent runs
        cache-dependency-path: '**/requirements.txt' # Corrected parameter name here

    # 3. Install required libraries (BeautifulSoup, Requests, spacy, etc.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install click
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Download the large English model for SpaCy used by your classifier
        python -m spacy download en_core_web_lg

    # 4. Run your main script (Make sure 'main.py' matches your actual file name)
    - name: Run Event Scraper
      run: python main.py

    # 5. Automatically save and push changes to GitHub if 'data.json' has been modified
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add only the modified data file to prevent unexpected conflicts
        git add data/data.json data/old_data.json
        
        # Check if there are actual changes before committing (avoids errors if data remains identical)
        if git diff --quiet && git diff --staged --quiet; then
          echo "No new events found today. Everything is up to date."
        else
          git commit -m "🔄 Automated agenda update: $(date +'%Y-%m-%d %H:%M')"
          git push
        fi