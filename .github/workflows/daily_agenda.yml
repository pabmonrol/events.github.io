name: Daily Event Scraper Update

on:
  schedule:
    # 03:17 UTC. Minute 17 avoids the top of the hour, when scheduled jobs are most often dropped.
    - cron: '17 3 * * *'
  workflow_dispatch: # This button allows you to manually trigger the scraper

permissions:
  contents: write # So the GitHub runner can save and commit data.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Cache virtualenv
        id: venv-cache
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m spacy download en_core_web_md

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(.venv/bin/python -c 'import playwright; print(playwright.__version__)')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browser (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: .venv/bin/python -m playwright install chromium

      - name: Install Playwright OS Dependencies
        run: .venv/bin/python -m playwright install-deps chromium

      - name: Run Event Scraper
        run: .venv/bin/python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/data.json data/data_special.json data/old_data.json data/old_data_special.json

          if git diff --quiet && git diff --staged --quiet; then
            echo "No new events found today. Everything is up to date."
          else
            git commit -m "🔄 Automated agenda update: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
