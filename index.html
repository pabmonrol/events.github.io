<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f4f6f8; margin: 0; padding: 20px;">
    
    <div class="nl-wrap">
        <div class="nl-header">
            <h1>Our Group Agenda! 🎈</h1>
            <p>Weekly event updates</p>
        </div>
        
        <div class="filters-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Sport">⚽ Sport</button>
            <button class="filter-btn" data-filter="Music">🎵 Music</button>
            <button class="filter-btn" data-filter="Culture">🧩 Culture</button>
            <button class="filter-btn" data-filter="Leisure">🪇 Leisure</button>
            <button class="filter-btn" data-filter="Nature">🌱 Nature</button>
        </div>
        
        <div id="agenda-container" style="padding: 10px 24px 0 24px;">
            </div>
    </div>

    <script>
        function toggleDetail(btn) {
            const row = btn.closest('.event-row');
            const panel = row.querySelector('.event-detail-panel');
            const isOpen = panel.classList.contains('open');

            panel.classList.toggle('open', !isOpen);
            btn.classList.toggle('expanded', !isOpen);
            btn.querySelector('.info-arrow').textContent = isOpen ? '▾' : '▴';
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
