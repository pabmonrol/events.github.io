<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda del Grupo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f4f6f8; margin: 0; padding: 20px;">
    
    <div class="nl-wrap">
        <div class="nl-header">
            <h1>¡Nuestra Agenda del Grupo! 🚀</h1>
            <p>Actualizaciones semanales de eventos</p>
        </div>
        
        <div class="filters-container">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="deportes">⚽ Deportes</button>
            <button class="filter-btn" data-filter="musica">🎵 Música/Fiesta</button>
        </div>
        
        <div id="agenda-container" style="padding: 10px 24px 0 24px;">
        </div>

        <div style="padding: 16px 24px; border-top: 1px solid #e1e4e8; text-align: center; background-color: #fafbfc;">
            <p style="font-size: 12px; color: #666666; margin: 0;">Enviado con cariño al grupo · <a href="#" style="color: #666666; text-decoration: underline;">Darse de baja</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
